<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="172 172 680 680" width="1024" height="1024">
  <defs>
    <path id="seed" d="M0,-12 C6.5,-5 6.5,6 0,12 C-6.5,6 -6.5,-5 0,-12Z" fill="#2a1a14"/>
    <rect id="tick" x="-3" y="-122" width="6" height="12" rx="2" fill="#1f4f1d"/>
  </defs>

  <!-- Melon face, centered and facing forward -->
  <g transform="translate(512 512)">
    <circle r="330" fill="#1f4f1d"/>
    <circle r="320" fill="#3f8a34"/>
    <circle r="296" fill="#1f4f1d"/>
    <circle r="290" fill="#b9dd8f"/>
    <circle r="272" fill="#c9252f"/>
    <circle r="272" fill="none" stroke="#a51d27" stroke-width="4"/>

    <!-- Seeds -->
    <g>
      <use xlink:href="#seed" transform="rotate(0) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(30) translate(0 -205)"/>
      <use xlink:href="#seed" transform="rotate(60) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(90) translate(0 -205)"/>
      <use xlink:href="#seed" transform="rotate(120) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(150) translate(0 -205)"/>
      <use xlink:href="#seed" transform="rotate(180) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(210) translate(0 -205)"/>
      <use xlink:href="#seed" transform="rotate(240) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(270) translate(0 -205)"/>
      <use xlink:href="#seed" transform="rotate(300) translate(0 -195)"/>
      <use xlink:href="#seed" transform="rotate(330) translate(0 -205)"/>
    </g>

    <!-- Dial -->
    <circle r="124" fill="#1f4f1d"/>
    <circle r="116" fill="#3d8a33"/>
    <use xlink:href="#tick" transform="rotate(0)"/><use xlink:href="#tick" transform="rotate(20)"/>
    <use xlink:href="#tick" transform="rotate(40)"/><use xlink:href="#tick" transform="rotate(60)"/>
    <use xlink:href="#tick" transform="rotate(80)"/><use xlink:href="#tick" transform="rotate(100)"/>
    <use xlink:href="#tick" transform="rotate(120)"/><use xlink:href="#tick" transform="rotate(140)"/>
    <use xlink:href="#tick" transform="rotate(160)"/><use xlink:href="#tick" transform="rotate(180)"/>
    <use xlink:href="#tick" transform="rotate(200)"/><use xlink:href="#tick" transform="rotate(220)"/>
    <use xlink:href="#tick" transform="rotate(240)"/><use xlink:href="#tick" transform="rotate(260)"/>
    <use xlink:href="#tick" transform="rotate(280)"/><use xlink:href="#tick" transform="rotate(300)"/>
    <use xlink:href="#tick" transform="rotate(320)"/><use xlink:href="#tick" transform="rotate(340)"/>
    <circle r="102" fill="#1f4f1d"/>
    <circle r="96" fill="#f6a623"/>
    <circle r="96" fill="none" stroke="#e08a12" stroke-width="6"/>

    <!-- Power symbol -->
    <g fill="none" stroke="#1f4f1d" stroke-width="22" stroke-linecap="round">
      <path d="M33.3,-37.6 A50,50 0 1 1 -33.3,-37.6"/>
      <line x1="0" y1="-62" x2="0" y2="-8"/>
    </g>
  </g>
</svg>
